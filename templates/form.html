<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Interest Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Career Interest Form</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="card p-4 shadow">
        <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" name="name" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Your Interests</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="drawing" value="Yes" id="drawing">
                <label class="form-check-label" for="drawing">Drawing</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="dancing" value="Yes" id="dancing">
                <label class="form-check-label" for="dancing">Dancing</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="singing" value="Yes" id="singing">
                <label class="form-check-label" for="singing">Singing</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="coding" value="Yes" id="coding">
                <label class="form-check-label" for="coding">Coding</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sports" value="Yes" id="sports">
                <label class="form-check-label" for="sports">Sports</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="photographer" value="Yes" id="photographer">
                <label class="form-check-label" for="photographer">Photography</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    {% if timestamp %}
    <div class="text-center mt-4">
        <audio controls autoplay>
            <source src="{{ url_for('static', filename='voice.mp3') }}?{{ timestamp }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>
    {% endif %}

    <div class="text-center mt-3">
        <a href="{{ url_for('show_responses') }}" class="btn btn-outline-secondary">View All Responses</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
