<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Animated Career Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(270deg, #e0f7fa, #fff3e0, #ffe0b2, #d1c4e9);
      background-size: 800% 800%;
      animation: animatedBackground 30s ease infinite;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
      transition: background 0.3s;
    }
    body.dark {
      background: linear-gradient(270deg, #121212, #1e1e1e, #212121, #2c2c2c);
      color: #eee;
    }
    @keyframes animatedBackground {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .bg-particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-particles span {
      position: absolute;
      display: block;
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: float 20s linear infinite;
    }
    .bg-particles span:nth-child(1) { left: 10%; animation-delay: 0s; }
    .bg-particles span:nth-child(2) { left: 25%; animation-delay: 4s; animation-duration: 24s; }
    .bg-particles span:nth-child(3) { left: 40%; animation-delay: 2s; animation-duration: 26s; }
    .bg-particles span:nth-child(4) { left: 60%; animation-delay: 1s; animation-duration: 22s; }
    .bg-particles span:nth-child(5) { left: 75%; animation-delay: 3s; animation-duration: 28s; }
    .bg-particles span:nth-child(6) { left: 90%; animation-delay: 2s; animation-duration: 18s; }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      max-width: 520px;
      width: 100%;
      margin: 80px auto;
      position: relative;
      z-index: 1;
      animation: slideIn 1s ease-out;
      transition: background 0.3s ease, color 0.3s ease;
    }
    body.dark .container {
      background: rgba(18, 18, 18, 0.85);
    }

    h2 {
      text-align: center;
      color: #00796b;
      font-size: 28px;
      margin-bottom: 30px;
    }
    body.dark h2 { color: #80cbc4; }

    .floating-label {
      position: relative;
      margin-bottom: 25px;
    }
    .floating-label input {
      width: 100%;
      padding: 14px 10px;
      border: 2px solid #b2dfdb;
      border-radius: 10px;
      background: transparent;
      font-size: 16px;
      outline: none;
      color: inherit;
    }
    .floating-label label {
      position: absolute;
      top: 14px;
      left: 12px;
      font-size: 16px;
      color: #757575;
      pointer-events: none;
      transition: 0.2s ease all;
    }
    .floating-label input:focus + label,
    .floating-label input:not(:placeholder-shown) + label {
      top: -10px;
      left: 10px;
      font-size: 12px;
      background: #fff;
      padding: 0 5px;
      color: #00796b;
    }
    body.dark .floating-label input:focus + label,
    body.dark .floating-label input:not(:placeholder-shown) + label {
      background: #121212;
      color: #80cbc4;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .checkbox-label:hover {
      transform: translateX(5px);
    }

    input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #00796b;
      border-radius: 4px;
      transition: all 0.3s ease;
      position: relative;
    }
    input[type="checkbox"]:checked {
      background-color: #004d40;
      box-shadow: 0 0 0 3px rgba(0, 150, 136, 0.3);
    }
    input[type="checkbox"]:checked::after {
      content: '✔';
      position: absolute;
      top: 0px;
      left: 3px;
      font-size: 14px;
      color: white;
    }

    button {
      background: linear-gradient(45deg, #26a69a, #00796b);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }
    button:active {
      transform: scale(0.97);
    }

    .message {
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      animation: fadeSlideIn 0.6s ease-out;
    }
    .success {
      background: #d0f8ce;
      color: #2e7d32;
    }
    .error {
      background: #ffcdd2;
      color: #c62828;
    }

    audio {
      display: block;
      margin: 10px auto 0;
      opacity: 0;
      animation: fadeInAudio 1s ease-in forwards;
      animation-delay: 0.5s;
    }

    a {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #00796b;
      text-decoration: none;
      font-weight: bold;
    }
    body.dark a { color: #80cbc4; }

    .toggle-theme {
      text-align: center;
      margin-bottom: 20px;
    }
    .toggle-theme button {
      background: none;
      border: 2px solid #00796b;
      color: #00796b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    body.dark .toggle-theme button {
      border-color: #80cbc4;
      color: #80cbc4;
    }

    .toggle-theme button:hover {
      background-color: rgba(0, 121, 107, 0.1);
    }

    .confetti-piece {
      width: 10px;
      height: 10px;
      position: fixed;
      top: -10px;
      border-radius: 50%;
      animation: confetti-fall 3s linear forwards;
      opacity: 0.8;
      z-index: 9999;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0); }
      100% { transform: translateY(100vh) rotate(720deg); }
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInAudio {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<!-- Particle Background -->
<div class="bg-particles">
  <span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<div class="container">
  <div class="toggle-theme">
    <button onclick="document.body.classList.toggle('dark')">Toggle Dark Mode</button>
  </div>

  <h2>Career Interest Form</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
        {% if category == 'success' %}
        <audio autoplay>
          <source src="{{ url_for('static', filename='voice.mp3') }}?t={{ timestamp }}" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const message = document.querySelector('.message.success');
            if (message) {
              for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                confetti.style.animationDelay = `${Math.random()}s`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
              }
            }
          });
        </script>
        {% endif %}
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <div class="floating-label">
      <input type="text" id="name" name="name" placeholder=" " required>
      <label for="name">Your Name</label>
    </div>

    <label>Select your interests:</label><br>
    <label class="checkbox-label"><input type="checkbox" name="drawing" value="Yes">Drawing</label>
    <label class="checkbox-label"><input type="checkbox" name="dancing" value="Yes">Dancing</label>
    <label class="checkbox-label"><input type="checkbox" name="singing" value="Yes">Singing</label>
    <label class="checkbox-label"><input type="checkbox" name="coding" value="Yes">Coding</label>
    <label class="checkbox-label"><input type="checkbox" name="sports" value="Yes">Sports</label>
    <label class="checkbox-label"><input type="checkbox" name="photographer" value="Yes">Photographer</label><br>

    <button type="submit">Submit</button>
  </form>

  <a href="{{ url_for('show_responses') }}">View All Responses</a>
</div>
</body>
</html>
