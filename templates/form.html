<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Animated Career Form</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WFEFC4HS9W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WFEFC4HS9W');
  </script>

  <!-- Include Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    /* Basic Styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.6s ease, color 0.6s ease; /* Smooth transition for background and text */
    }

    /* Dark Mode Styles */
    body.dark {
      background-color: #2c2c2c;
      color: white;
    }

    body.dark h2, 
    body.dark label, 
    body.dark button {
      color: white;
    }

    body.dark .container {
      background-color: #333;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    /* Light Mode Styles */
    body {
      background-color: #f7f7f7;
      color: #333;
    }

    .container {
      background-color: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    /* Particle background */
    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none; /* Allow interaction with elements above */
    }

    /* Form Styling */
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      font-size: 16px;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="checkbox"], select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    input[type="text"], select {
      background-color: #f1f1f1;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    button {
      background-color: #0056b3;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004494;
    }

    button:focus {
      outline: none;
    }

    .checkbox-label {
      display: block;
      margin-bottom: 10px;
    }

    /* Toggle Theme Button */
    .toggle-theme {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .toggle-theme button {
      background-color: #4CAF50;
      padding: 12px 24px;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s ease;
    }

    .toggle-theme button:hover {
      background-color: #45a049;
    }

    /* Confetti effect (added animation) */
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #ffeb3b;
      border-radius: 50%;
      animation: confetti-fall 3s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

<!-- Particle Background -->
<div id="particles-js"></div>

<div class="container">
  <!-- Dark Mode Toggle Button -->
  <div class="toggle-theme">
    <button onclick="document.body.classList.toggle('dark')">Toggle Dark Mode</button>
  </div>

  <h2>Career Interest Form</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
        {% if category == 'success' %}
        <audio autoplay>
          <source src="{{ url_for('static', filename='voice.mp3') }}?t={{ timestamp }}" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const message = document.querySelector('.message.success');
            if (message) {
              for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                confetti.style.animationDelay = `${Math.random()}s`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
              }
            }
          });
        </script>
        {% endif %}
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <div class="floating-label">
      <input type="text" id="name" name="name" placeholder=" " required>
      <label for="name">Your Name</label>
    </div>

    <label>Select your interests:</label><br>
    <label class="checkbox-label"><input type="checkbox" name="drawing" value="Yes">Drawing</label>
    <label class="checkbox-label"><input type="checkbox" name="dancing" value="Yes">Dancing</label>
    <label class="checkbox-label"><input type="checkbox" name="singing" value="Yes">Singing</label>
    <label class="checkbox-label"><input type="checkbox" name="coding" value="Yes">Coding</label>
    <label class="checkbox-label"><input type="checkbox" name="sports" value="Yes">Sports</label>
    <label class="checkbox-label"><input type="checkbox" name="photographer" value="Yes">Photographer</label><br>

    <button type="submit">Submit</button>
  </form>

  <a href="{{ url_for('show_responses') }}">View All Responses</a>
</div>

<!-- Initialize Particles.js -->
<script>
  particlesJS('particles-js', {
    particles: {
      number: {
        value: 100,
        density: {
          enable: true,
          value_area: 800
        }
      },
      color: {
        value: "#ffffff"
      },
      shape: {
        type: "circle",
        stroke: {
          width: 0,
          color: "#000000"
        },
        polygon: {
          nb_sides: 5
        }
      },
      opacity: {
        value: 0.5,
        random: true,
        anim: {
          enable: true,
          speed: 1,
          opacity_min: 0.1,
          sync: false
        }
      },
      size: {
        value: 3,
        random: true,
        anim: {
          enable: false,
          speed: 4,
          size_min: 0.1,
          sync: false
        }
      },
      line_linked: {
        enable: true,
        distance: 150,
        color: "#ffffff",
        opacity: 0.4,
        width: 1
      },
      move: {
        enable: true,
        speed: 3,
        direction: "none",
        random: true,
        straight: false,
        out_mode: "out",
        bounce: false,
        attract: {
          enable: false,
          rotateX: 600,
          rotateY: 1200
        }
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: {
          enable: true,
          mode: "repulse"
        },
        onclick: {
          enable: true,
          mode: "push"
        },
        resize: true
      },
      modes: {
        grab: {
          distance: 400,
          line_linked: {
            opacity: 1
          }
        },
        repulse: {
          distance: 200
        },
        push: {
          particles_nb: 4
        },
        remove: {
          particles_nb: 2
        }
      }
    },
    retina_detect: true
  });
</script>

</body>
</html>
