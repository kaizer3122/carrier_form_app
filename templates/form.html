<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Animated Career Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    body.dark .container {
      background: rgba(0, 0, 0, 0.7);
      color: white;
    }

    h2 {
      margin-bottom: 20px;
    }

    input, button, label {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input, select {
      background: #f0f0f0;
    }

    body.dark input, body.dark select {
      background: #333;
      color: white;
    }

    button {
      background: #23a6d5;
      color: white;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
    }

    .toggle-theme {
      margin-bottom: 20px;
    }

    .toggle-theme button {
      background: #333;
      color: white;
    }

    body.dark .toggle-theme button {
      background: #f0f0f0;
      color: #333;
    }

    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>
<body>
<div id="particles-js"></div>

<div class="container">
  <div class="toggle-theme">
    <button onclick="toggleDarkMode()">Toggle Dark Mode 🌙</button>
  </div>

  <h2>Career Interest Form</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
        {% if category == 'success' %}
          <script>
            document.addEventListener('DOMContentLoaded', () => {
              for (let i = 0; i < 30; i++) {
                const emoji = document.createElement('div');
                emoji.textContent = ['🎉','✨','🎊','💥'][Math.floor(Math.random() * 4)];
                emoji.style.position = 'fixed';
                emoji.style.left = Math.random() * 100 + 'vw';
                emoji.style.top = '-2em';
                emoji.style.fontSize = '2em';
                emoji.style.animation = `fall ${2 + Math.random() * 3}s ease-out forwards`;
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 5000);
              }
            });
          </script>
          <style>
            @keyframes fall {
              to { transform: translateY(110vh) rotate(360deg); }
            }
          </style>
        {% endif %}
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <input type="text" name="name" placeholder="Your Name" required>
    <label><input type="checkbox" name="drawing" value="Yes"> Drawing</label>
    <label><input type="checkbox" name="dancing" value="Yes"> Dancing</label>
    <label><input type="checkbox" name="singing" value="Yes"> Singing</label>
    <label><input type="checkbox" name="coding" value="Yes"> Coding</label>
    <label><input type="checkbox" name="sports" value="Yes"> Sports</label>
    <label><input type="checkbox" name="photographer" value="Yes"> Photographer</label>
    <button type="submit">Submit</button>
  </form>

  <a href="{{ url_for('show_responses') }}" style="color: inherit;">View All Responses</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script>
  particlesJS('particles-js', {
    particles: {
      number: { value: 80 },
      size: { value: 3 },
      move: { speed: 1 },
      line_linked: { enable: true },
      color: { value: '#ffffff' },
      opacity: { value: 0.5 }
    },
    interactivity: {
      events: {
        onhover: { enable: true, mode: 'repulse' }
      }
    }
  });

  function toggleDarkMode() {
    document.body.classList.toggle('dark');
  }
</script>
</body>
</html>
