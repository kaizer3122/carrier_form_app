<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Animated Career Form</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WFEFC4HS9W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WFEFC4HS9W');
  </script>

  <!-- Include Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    /* Basic Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
    }

    /* Dark Mode Styles */
    body.dark {
      background-color: #333;
      color: white;
    }
    body.dark h2, 
    body.dark label, 
    body.dark button {
      color: white;
    }

    body.dark input, 
    body.dark select, 
    body.dark button {
      background-color: #555;
      color: white;
      border: 1px solid #ccc;
    }

    body.dark .container {
      background-color: #444;
      border-radius: 8px;
      padding: 20px;
    }

    /* Particle background */
    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Ensures particles stay behind other elements */
    }

    .container {
      position: relative;
      z-index: 1; /* Ensures form stays on top of the particles */
    }
  </style>
</head>
<body>

<!-- Particle Background -->
<div id="particles-js"></div>

<div class="container">
  <div class="toggle-theme">
    <button onclick="document.body.classList.toggle('dark')">Toggle Dark Mode</button>
  </div>

  <h2>Career Interest Form</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
        {% if category == 'success' %}
        <audio autoplay>
          <source src="{{ url_for('static', filename='voice.mp3') }}?t={{ timestamp }}" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const message = document.querySelector('.message.success');
            if (message) {
              for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                confetti.style.animationDelay = `${Math.random()}s`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
              }
            }
          });
        </script>
        {% endif %}
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <div class="floating-label">
      <input type="text" id="name" name="name" placeholder=" " required>
      <label for="name">Your Name</label>
    </div>

    <label>Select your interests:</label><br>
    <label class="checkbox-label"><input type="checkbox" name="drawing" value="Yes">Drawing</label>
    <label class="checkbox-label"><input type="checkbox" name="dancing" value="Yes">Dancing</label>
    <label class="checkbox-label"><input type="checkbox" name="singing" value="Yes">Singing</label>
    <label class="checkbox-label"><input type="checkbox" name="coding" value="Yes">Coding</label>
    <label class="checkbox-label"><input type="checkbox" name="sports" value="Yes">Sports</label>
    <label class="checkbox-label"><input type="checkbox" name="photographer" value="Yes">Photographer</label><br>

    <button type="submit">Submit</button>
  </form>

  <a href="{{ url_for('show_responses') }}">View All Responses</a>
</div>

<!-- Initialize Particles.js -->
<script>
  particlesJS('particles-js', {
    particles: {
      number: {
        value: 100,
        density: {
          enable: true,
          value_area: 800
        }
      },
      color: {
        value: "#ffffff"
      },
      shape: {
        type: "circle",
        stroke: {
          width: 0,
          color: "#000000"
        },
        polygon: {
          nb_sides: 5
        }
      },
      opacity: {
        value: 0.5,
        random: true,
        anim: {
          enable: true,
          speed: 1,
          opacity_min: 0.1,
          sync: false
        }
      },
      size: {
        value: 3,
        random: true,
        anim: {
          enable: false,
          speed: 4,
          size_min: 0.1,
          sync: false
        }
      },
      line_linked: {
        enable: true,
        distance: 150,
        color: "#ffffff",
        opacity: 0.4,
        width: 1
      },
      move: {
        enable: true,
        speed: 3,
        direction: "none",
        random: true,
        straight: false,
        out_mode: "out",
        bounce: false,
        attract: {
          enable: false,
          rotateX: 600,
          rotateY: 1200
        }
      }
    },
    interactivity: {
      detect_on: "canvas",
      events: {
        onhover: {
          enable: true,
          mode: "repulse"
        },
        onclick: {
          enable: true,
          mode: "push"
        },
        resize: true
      },
      modes: {
        grab: {
          distance: 400,
          line_linked: {
            opacity: 1
          }
        },
        repulse: {
          distance: 200
        },
        push: {
          particles_nb: 4
        },
        remove: {
          particles_nb: 2
        }
      }
    },
    retina_detect: true
  });
</script>

</body>
</html>
