<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Interest Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 400px;
            animation: fadeInDown 1s;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"], input[type="checkbox"] {
            margin-top: 5px;
        }
        .form-check {
            margin: 5px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: linear-gradient(90deg, #74ebd5, #ACB6E5);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .flash {
            margin: 15px 0;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .flash.success {
            background-color: #d4edda;
            color: #155724;
        }
        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
<div class="container animate__animated animate__fadeIn">
    <h1>Career Interest Form</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }} animate__animated animate__bounceIn">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Name:
            <input type="text" name="name" required>
        </label>
        <div class="form-check">
            <label><input type="checkbox" name="drawing" value="Yes"> Drawing</label>
        </div>
        <div class="form-check">
            <label><input type="checkbox" name="dancing" value="Yes"> Dancing</label>
        </div>
        <div class="form-check">
            <label><input type="checkbox" name="singing" value="Yes"> Singing</label>
        </div>
        <div class="form-check">
            <label><input type="checkbox" name="coding" value="Yes"> Coding</label>
        </div>
        <div class="form-check">
            <label><input type="checkbox" name="sports" value="Yes"> Sports</label>
        </div>
        <div class="form-check">
            <label><input type="checkbox" name="photographer" value="Yes"> Photography</label>
        </div>
        <button type="submit">Submit</button>
    </form>

    <audio id="voice" src="{{ url_for('static', filename='voice.mp3') }}?{{ timestamp }}"></audio>
</div>

<script>
    window.onload = function() {
        const flashMessage = document.querySelector('.flash.success');
        if (flashMessage) {
            document.getElementById('voice').play();

            // Confetti effect
            confetti();
        }
    };

    function confetti() {
        const duration = 1 * 1000;
        const end = Date.now() + duration;

        (function frame() {
            confettiEffect();
            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    function confettiEffect() {
        const emoji = ['🎉', '✨', '🎊', '💥'];
        const el = document.createElement('div');
        el.textContent = emoji[Math.floor(Math.random() * emoji.length)];
        el.style.position = 'fixed';
        el.style.left = Math.random() * window.innerWidth + 'px';
        el.style.top = '-20px';
        el.style.fontSize = '24px';
        el.style.animation = 'drop 1s linear';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes drop {
            to { transform: translateY(100vh); opacity: 0; }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
